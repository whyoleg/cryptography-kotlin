name: Run provider tests
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: compatibility-tests
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# 1. generate: every provider generates and validates test data on every platform
# 2. restore: every provider validates test data generated by all providers on all platforms
# 3. limitations: limitations observed in all environments must match the committed `limitations.json`
jobs:
  tests-compatibility-generate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest' ]
        target: [ 'jvmAll', 'js', 'wasm', 'native', 'connectedAndroid' ]
        include:
          - os: 'macos-latest'
            target: 'macos'
          - os: 'macos-latest'
            target: 'ios'
          - os: 'macos-latest'
            target: 'watchos'
          - os: 'macos-latest'
            target: 'tvos'
          - os: 'windows-latest'
            target: 'native'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment

      - name: Run tests
        if: ${{ matrix.target != 'connectedAndroid' }}
        run: >
          ./gradlew
          ${{ matrix.target }}ProviderTest
          --continue
          -Pckbuild.providerTests.step=generate
          -Pckbuild.teststorage.keep=true
          -Pckbuild.skipReleaseLinkTasks=${{ github.ref_name != 'main' }}

      - name: Run tests (android)
        if: ${{ matrix.target == 'connectedAndroid' }}
        uses: ./.github/actions/run-android-emulator-tests
        with:
          test-reports-classifier: 'compatibility-generate'
          run: >
            ./gradlew
            ${{ matrix.target }}ProviderTest
            --continue
            -Pckbuild.providerTests.step=generate
            -Pckbuild.teststorage.keep=true

      # test storage with generated data, which is validated by all other providers and platforms
      - name: Dump test storage
        if: ${{ !cancelled() }}
        run: tar -cf ${{ matrix.os }}-${{ matrix.target }}.tar build/test-storage
      - name: Upload test storage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-tests-data-${{ matrix.os }}-${{ matrix.target }}
          path: ${{ matrix.os }}-${{ matrix.target }}.tar
          if-no-files-found: error

      # only environments and reports, without test data, see `UpdateTestLimitationsTask`
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.target }}
          path: |
            build/test-storage/*.json
            build/test-storage/*/*/*.json
          if-no-files-found: error

  tests-compatibility-restore:
    needs: [ tests-compatibility-generate ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest' ]
        target: [ 'jvmAll', 'js', 'wasm', 'native', 'connectedAndroid' ]
        include:
          - os: 'macos-latest'
            target: 'macos'
          - os: 'macos-latest'
            target: 'ios'
          - os: 'macos-latest'
            target: 'watchos'
          - os: 'macos-latest'
            target: 'tvos'
          - os: 'windows-latest'
            target: 'native'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment

      - name: Download test storage
        uses: actions/download-artifact@v8
        with:
          pattern: compatibility-tests-data-*
          merge-multiple: true
      - name: Restore test storage
        run: for file in *.tar; do tar -xf "$file"; done
      - name: Delete downloaded test storage
        run: rm *.tar

      - name: Run tests
        if: ${{ matrix.target != 'connectedAndroid' }}
        run: >
          ./gradlew
          ${{ matrix.target }}ProviderTest
          --continue
          -Pckbuild.providerTests.step=restore
          -Pckbuild.skipReleaseLinkTasks=${{ github.ref_name != 'main' }}

      - name: Run tests (android)
        if: ${{ matrix.target == 'connectedAndroid' }}
        uses: ./.github/actions/run-android-emulator-tests
        with:
          test-reports-classifier: 'compatibility-restore'
          run: >
            ./gradlew
            ${{ matrix.target }}ProviderTest
            --continue
            -Pckbuild.providerTests.step=restore

  test-limitations:
    needs: [ tests-compatibility-generate ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-environment

      - name: Download test reports
        uses: actions/download-artifact@v8
        with:
          pattern: test-reports-*
          path: build/test-storage
          merge-multiple: true

      - name: Update limitations
        run: ./gradlew updateTestLimitations -Pckbuild.testLimitations.strict=true

      - name: Check limitations
        run: git diff --exit-code limitations.json

      # to update `limitations.json` without running all tests locally
      - name: Upload limitations
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: limitations
          path: limitations.json
